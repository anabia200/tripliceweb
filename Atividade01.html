<!DOCTYPE html>
<html lang="pt/br">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="Atividade01.html.css">
</head>
<body>
<form id="formulario">
    <label for="nome">Nome Completo</label>
    <input id="nome" type="text"/>

    <label for="email">Email</label>
    <input id="email" type="email"/>

    <label for="senha">Senha</label>
    <input id="senha" type="password"/>

    <label for="Number">Idade </label>
    <input id="Number" type="date"/>

    <label for="nascimento">Data De Nascimento </label>
    <input id="nascimento" type="date"/>


    <label>Feminino<input id="fem" name="genero" type="radio"/></label>
    <label>Masculino<input id="masc" name="genero" type="radio"/></label>
    <label>Prefiro Nao Dizer<input id="outros" name="genero" type="radio"/></label>


    <p>Turno:</p>
    <label>Matutino<input id="matutino" type="checkbox"/></label>
    <label>Vespertino<input id="vespertino" type="checkbox"/></label>
    <label>Noturno<input id="noturno" type="checkbox"/></label>

    <label for="cor"> Cor destaque:</label>
    <input id="cor" type="color" name="cor"/>
    <button>Enviar</button>
</form>
<script src="Atividade01.html.js"></script>
</body>
</html>
